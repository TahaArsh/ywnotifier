name: Check YoWorld Auction Wishlist

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: yoworld-watcher-run
  cancel-in-progress: false

jobs:
  check-auctions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python watcher.py

      - name: Commit updated seen_bids.json (if changed)
        run: |
          git config user.name "yoworld-watcher-bot"
          git config user.email "actions@github.com"
          git add seen_bids.json
          git diff --staged --quiet || git commit -m "Update seen bids [skip ci]"
          git pull --rebase
          git push
